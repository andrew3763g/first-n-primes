name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project with its dev tools
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest
      - name: ruff check
        run: python -m ruff check
      - name: ruff format
        run: python -m ruff format --check
      - name: mypy
        run: python -m mypy --strict first_n_primes.py tests

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and run the console script
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          # Windows writes CRLF; strip CR so the comparisons are the same.
          version="$(python -c 'import first_n_primes as m; print(m.__version__)' | tr -d '\r')"
          test "$(first-n-primes --version | tr -d '\r')" = "first-n-primes $version"
          test "$(first-n-primes 50 --nth | tr -d '\r')" = "The 50th prime is 229."
          first-n-primes 5
          first-n-primes 100000 | head -n 1
          set +e
          first-n-primes 0
          status=$?
          set -e
          test "$status" -eq 2
