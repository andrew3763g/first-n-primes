name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install checks
        run: python -m pip install pytest hypothesis ruff mypy
      - name: pytest
        run: python -m pytest
      - name: ruff check
        run: python -m ruff check
      - name: ruff format
        run: python -m ruff format --check
      - name: mypy
        run: python -m mypy --strict first_n_primes.py tests
